name: Seynaro — тест Push

on:
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest

    env:
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}

    steps:
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Установить библиотеку
        run: npm install --no-save web-push

      - name: Отправить тестовое уведомление и показать результат сервера
        run: |
          node <<'NODE'
          const webpush = require('web-push');

          async function main() {
            const {
              VAPID_PUBLIC_KEY,
              VAPID_PRIVATE_KEY,
              VAPID_SUBJECT,
              PUSH_SUBSCRIPTION
            } = process.env;

            if (
              !VAPID_PUBLIC_KEY ||
              !VAPID_PRIVATE_KEY ||
              !VAPID_SUBJECT ||
              !PUSH_SUBSCRIPTION
            ) {
              throw new Error('Не найдены необходимые секреты GitHub');
            }

            const subscription = JSON.parse(PUSH_SUBSCRIPTION);

            if (!subscription.endpoint || !subscription.keys) {
              throw new Error('PUSH_SUBSCRIPTION имеет неверный формат');
            }

            webpush.setVapidDetails(
              VAPID_SUBJECT,
              VAPID_PUBLIC_KEY,
              VAPID_PRIVATE_KEY
            );

            console.log('Подписка загружена. Push-сервис:', new URL(subscription.endpoint).hostname);
            console.log('Отправляем уникальное тестовое уведомление…');

            const response = await webpush.sendNotification(
              subscription,
              JSON.stringify({
                title: '🕌 Seynaro — тест доставки',
                body: 'Если ты видишь это сообщение, Push-уведомления работают.',
                tag: 'seynaro-diagnostic-' + Date.now(),
                url: './'
              })
            );

            console.log('Push-сервис принял запрос. HTTP статус:', response.statusCode);
            console.log('Ответ получен. Это подтверждает приём запроса Push-сервисом, но не гарантирует отображение на устройстве.');
          }

          main().catch(error => {
            console.error('Ошибка отправки Push:', error.statusCode || '', error.message);
            process.exit(1);
          });
          NODE
