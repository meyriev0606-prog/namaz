
name: Seynaro — автоматические Push-уведомления

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seynaro-prayer-push
  cancel-in-progress: false

jobs:
  send-prayer-reminders:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Moscow
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить библиотеки
        run: npm install --no-save adhan web-push

      - name: Рассчитать время и отправить уведомления
        run: |
          node <<'NODE'
          const fs = require('fs');
          const adhan = require('adhan');
          const webpush = require('web-push');

          async function main() {
            const required = [
              'VAPID_PUBLIC_KEY',
              'VAPID_PRIVATE_KEY',
              'VAPID_SUBJECT',
              'PUSH_SUBSCRIPTION'
            ];

            for (const name of required) {
              if (!process.env[name]) {
                throw new Error('Не задан секрет GitHub: ' + name);
              }
            }

            webpush.setVapidDetails(
              process.env.VAPID_SUBJECT,
              process.env.VAPID_PUBLIC_KEY,
              process.env.VAPID_PRIVATE_KEY
            );

            const subscription =
              JSON.parse(process.env.PUSH_SUBSCRIPTION);

            const coords = new adhan.Coordinates(55.7558, 37.6173);
            const params = adhan.CalculationMethod.MuslimWorldLeague();
            params.madhab = adhan.Madhab.Shafi;

            const now = new Date();
            const prayers = new adhan.PrayerTimes(coords, now, params);

            const names = {
              fajr: 'Фаджр',
              dhuhr: 'Зухр',
              asr: 'Аср',
              maghrib: 'Магриб',
              isha: 'Иша'
            };

            const stateFile = '.github/prayer-push-state.json';
            let state = {};

            if (fs.existsSync(stateFile)) {
              state = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
            }

            const today = [
              now.getFullYear(),
              String(now.getMonth() + 1).padStart(2, '0'),
              String(now.getDate()).padStart(2, '0')
            ].join('-');

            const nowMs = now.getTime();
            let changed = false;

            for (const [key, name] of Object.entries(names)) {
              const prayerTime = prayers[key];

              for (const advance of [10, 0]) {
                const target = new Date(
                  prayerTime.getTime() - advance * 60_000
                );

                // Не отправляем уведомления за пределами сегодняшнего дня.
                if (
                  target.getFullYear() !== now.getFullYear() ||
                  target.getMonth() !== now.getMonth() ||
                  target.getDate() !== now.getDate()
                ) continue;

                const difference = nowMs - target.getTime();

                // GitHub Actions проверяет расписание каждые 5 минут.
                // Дополнительный запас учитывает возможную задержку запуска.
                if (difference < 0 || difference > 8 * 60_000) continue;

                const marker = `${today}_${key}_${advance}`;

                if (state[marker]) continue;

                const body = advance > 0
                  ? `Через ${advance} мин намаз ${name} (${targetTime(prayerTime)})`
                  : `Время намаза ${name} — ${targetTime(prayerTime)}`;

                await webpush.sendNotification(
                  subscription,
                  JSON.stringify({
                    title: '🕌 ' + name,
                    body,
                    tag: 'seynaro-' + marker,
                    url: './'
                  })
                );

                state[marker] = new Date().toISOString();
                changed = true;
                console.log('Отправлено:', marker);
              }
            }

            // Удаляем старые отметки, чтобы файл не рос бесконечно.
            for (const marker of Object.keys(state)) {
              if (!marker.startsWith(today)) {
                const datePart = marker.slice(0, 10);
                const age = (Date.parse(today) - Date.parse(datePart))
                  / 86_400_000;

                if (Number.isFinite(age) && age > 3) {
                  delete state[marker];
                  changed = true;
                }
              }
            }

            if (changed) {
              fs.writeFileSync(
                stateFile,
                JSON.stringify(state, null, 2) + '\n'
              );
            } else {
              console.log('Сейчас время отправки уведомлений не наступило.');
            }
          }

          function targetTime(date) {
            return date.toLocaleTimeString('ru-RU', {
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            });
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Сохранить отметки отправленных уведомлений
        run: |
          if ! git diff --quiet -- .github/prayer-push-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/prayer-push-state.json
            git commit -m "Update prayer push notification state"
            git push origin HEAD:main
          fi
