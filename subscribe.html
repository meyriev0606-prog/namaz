<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Seynaro — Push-уведомления</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      margin-top: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .hint { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Seynaro — Push-уведомления</h1>
    <p>Подключи это устройство, чтобы получать напоминания, даже когда сайт закрыт.</p>
    <button id="subscribeButton">Включить уведомления</button>
    <button id="copyButton" disabled>Скопировать подписку</button>
    <p id="status" role="status">Проверяем поддержку уведомлений…</p>
    <p class="hint">Разреши уведомления в окне браузера. Автоматическая отправка требует отдельной настройки сервера.</p>
  </main>

  <script>
    // Публичный VAPID-ключ
    const VAPID_PUBLIC_KEY =
      'BCzLGtBynIij9lETBxYVEjvLKN6mAjoSe1oztAJRBFgON6RJg9J-VyunS2osZMq77KmMaxNNhhUc1Rv1wf8c8sw';

    const statusEl = document.getElementById('status');
    const subscribeButton = document.getElementById('subscribeButton');
    const copyButton = document.getElementById('copyButton');

    let subscriptionJson = '';

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from(raw, char => char.charCodeAt(0));
    }

    async function subscribe() {
      subscribeButton.disabled = true;

      try {
        if (!('serviceWorker' in navigator) ||
            !('PushManager' in window) ||
            !('Notification' in window)) {
          throw new Error('Этот браузер не поддерживает Push-уведомления.');
        }

        if (!window.isSecureContext) {
          throw new Error('Открой сайт через HTTPS.');
        }

        const permission = await Notification.requestPermission();

        if (permission !== 'granted') {
          throw new Error('Разрешение на уведомления не выдано. Разреши их в настройках браузера.');
        }

        const registration = await navigator.serviceWorker.register('./sw.js');
        await navigator.serviceWorker.ready;

        let subscription = await registration.pushManager.getSubscription();

        if (subscription) {
          const existingKey = subscription.options &&
            subscription.options.applicationServerKey;

          // Если подписка создана с другим VAPID-ключом,
          // удаляем её и создаём новую.
          if (existingKey) {
            const existingBytes = new Uint8Array(existingKey);
            const expectedBytes = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
            const sameKey = existingBytes.length === expectedBytes.length &&
              existingBytes.every((byte, index) => byte === expectedBytes[index]);

            if (!sameKey) {
              await subscription.unsubscribe();
              subscription = null;
            }
          }
        }

        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }

        subscriptionJson = JSON.stringify(subscription);
        copyButton.disabled = false;
        setStatus('Подписка создана на этом устройстве. Скопируй её и сохрани в GitHub Secrets как PUSH_SUBSCRIPTION. Автоматическая отправка ещё требует настройки.');
      } catch (error) {
        setStatus('Не удалось включить уведомления: ' + error.message);
      } finally {
        subscribeButton.disabled = false;
      }
    }

    subscribeButton.addEventListener('click', subscribe);

    copyButton.addEventListener('click', async () => {
      if (!subscriptionJson) return;

      try {
        await navigator.clipboard.writeText(subscriptionJson);
        setStatus('Подписка скопирована. Сохрани её в GitHub Secrets как PUSH_SUBSCRIPTION.');
      } catch (error) {
        setStatus('Автоматическое копирование недоступно. Подписка отображена ниже — скопируй её вручную.');
        const output = document.createElement('textarea');
        output.value = subscriptionJson;
        output.rows = 6;
        output.style.width = '100%';
        output.style.marginTop = '12px';
        output.setAttribute('aria-label', 'Данные подписки');
        document.querySelector('main').appendChild(output);
        output.focus();
        output.select();
      }
    });

    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      setStatus('Браузер не поддерживает Push-уведомления.');
    } else {
      setStatus('Готово к подключению. Нажми «Включить уведомления».');
    }
  </script>
</body>
</html>
