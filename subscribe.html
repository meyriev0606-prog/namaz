<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Seynaro — Push-уведомления</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101827;
      color: #f3f6fc;
      font: 16px/1.5 Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      border: 1px solid #2d3b51;
      border-radius: 20px;
      background: #182337;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #c2cde0; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #4f8cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status {
      margin-top: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .hint { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Seynaro — Push-уведомления</h1>
    <p>Подключи это устройство, чтобы получать напоминания, даже когда сайт закрыт.</p>
    <button id="subscribeButton">Включить уведомления</button>
    <button id="copyButton" disabled>Скопировать подписку</button>
    <p id="status" role="status">Проверяем поддержку уведомлений…</p>
    <p class="hint">Разреши уведомления в окне браузера. Автоматическая отправка требует отдельной настройки сервера.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Публичные параметры Supabase. Publishable key разрешено использовать в браузере.
    const SUPABASE_URL = "https://gkcrvhnviahbqfprurqi.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4BrYzlCZgLyqVSJRFPEvXg_5Dd1Sjti";
    const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // Публичный VAPID-ключ
    const VAPID_PUBLIC_KEY =
      'BCzLGtBynIij9lETBxYVEjvLKN6mAjoSe1oztAJRBFgON6RJg9J-VyunS2osZMq77KmMaxNNhhUc1Rv1wf8c8sw';

    const statusEl = document.getElementById('status');
    const subscribeButton = document.getElementById('subscribeButton');
    const copyButton = document.getElementById('copyButton');

    let subscriptionJson = '';

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from(raw, char => char.charCodeAt(0));
    }

    function diagnostics() {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      return {
        secureContext: window.isSecureContext,
        serviceWorker: 'serviceWorker' in navigator,
        pushManager: 'PushManager' in window,
        notificationAPI: 'Notification' in window,
        standalone,
        permission: ('Notification' in window) ? Notification.permission : 'API отсутствует'
      };
    }

    function describeEnvironment() {
      const d = diagnostics();
      return 'Диагностика устройства:\n' +
        '• Установленное приложение: ' + (d.standalone ? 'да' : 'нет (страница открыта как вкладка браузера)') + '\n' +
        '• HTTPS: ' + (d.secureContext ? 'да' : 'нет') + '\n' +
        '• Service Worker: ' + (d.serviceWorker ? 'есть' : 'нет') + '\n' +
        '• PushManager: ' + (d.pushManager ? 'есть' : 'нет') + '\n' +
        '• Notification API: ' + (d.notificationAPI ? 'есть' : 'нет') + '\n' +
        '• Разрешение: ' + d.permission;
    }

    async function subscribe() {
      subscribeButton.disabled = true;
      try {
        const d = diagnostics();
        if (!d.secureContext) throw new Error('Нужен защищённый HTTPS-адрес.');
        if (!d.standalone) {
          throw new Error('Страница открыта не внутри установленного приложения. Закрой эту вкладку, открой значок «Намаз» на экране Домой и перейди: Звонки → Подключить Push.\n\n' + describeEnvironment());
        }
        if (!d.serviceWorker) throw new Error('В этом контексте недоступен Service Worker.\n\n' + describeEnvironment());
        if (!d.pushManager) throw new Error('iOS не предоставила PushManager. Проверь, что сайт запущен с иконки на экране Домой, а не во вкладке Safari.\n\n' + describeEnvironment());
        if (!d.notificationAPI) throw new Error('Notification API недоступен в этом контексте.\n\n' + describeEnvironment());

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          throw new Error(permission === 'denied'
            ? 'Уведомления запрещены. Открой Настройки iPhone → Уведомления → Намаз и разреши уведомления, затем попробуй снова.'
            : 'Разрешение на уведомления не выдано.');
        }

        const registration = await navigator.serviceWorker.register('./sw.js');
        const readyRegistration = await navigator.serviceWorker.ready;
        const activeRegistration = readyRegistration || registration;
        let subscription = await activeRegistration.pushManager.getSubscription();

        if (subscription) {
          const existingKey = subscription.options && subscription.options.applicationServerKey;
          if (existingKey) {
            const existingBytes = new Uint8Array(existingKey);
            const expectedBytes = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
            const sameKey = existingBytes.length === expectedBytes.length &&
              existingBytes.every((byte, index) => byte === expectedBytes[index]);
            if (!sameKey) {
              await subscription.unsubscribe();
              subscription = null;
            }
          }
        }

        if (!subscription) {
          subscription = await activeRegistration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }

        subscriptionJson = JSON.stringify(subscription);
        copyButton.disabled = false;

        // Сохраняем подписку в облаке, чтобы GitHub Actions мог отправлять
        // уведомления даже при закрытом сайте.
        if (!supabaseClient) throw new Error('Не загрузилась библиотека Supabase. Проверь интернет и обнови страницу.');
        setStatus('Push подключён. Сохраняем устройство в облачную базу…');
        let { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) {
          const authResult = await supabaseClient.auth.signInAnonymously();
          if (authResult.error) throw new Error('Не удалось создать анонимную сессию. Проверь, включён ли Anonymous Sign-Ins в Supabase: ' + authResult.error.message);
          sessionData = { session: authResult.data.session };
        }
        const savedCity = localStorage.getItem('namaz_city') || '55.7558,37.6173';
        const coords = savedCity.split(',').map(Number);
        const latitude = coords[0], longitude = coords[1];
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
          throw new Error('Не удалось определить координаты города. Открой основное приложение, выбери город и повтори подключение.');
        }
        let appSettings = {};
        let appNotify = {};
        try { appSettings = JSON.parse(localStorage.getItem('namaz_settings') || '{}'); } catch (_) {}
        try { appNotify = JSON.parse(localStorage.getItem('namaz_notify') || '{}'); } catch (_) {}
        const prayers = appNotify.prayers || { fajr: true, dhuhr: true, asr: true, maghrib: true, isha: true };
        const deviceRow = {
          owner_id: sessionData.session.user.id,
          endpoint: subscription.endpoint,
          subscription: subscription.toJSON(),
          latitude,
          longitude,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
          city_label: localStorage.getItem('namaz_gps') === '1' ? 'Моё местоположение' : 'Выбранный город',
          calculation_method: appSettings.method || 'MuslimWorldLeague',
          madhab: appSettings.madhab === 'hanafi' ? 'hanafi' : 'shafi',
          prayer_preferences: prayers,
          notify_before_minutes: Number.isFinite(Number(appNotify.advanceMinutes)) ? Number(appNotify.advanceMinutes) : 10,
          notify_at_start: appNotify.atStart !== false,
          enabled: appNotify.enabled !== false
        };
        const { error: saveError } = await supabaseClient
          .from('prayer_devices')
          .upsert(deviceRow, { onConflict: 'endpoint' });
        if (saveError) {
          if (saveError.code === '42P01' || saveError.code === 'PGRST205') {
            throw new Error('Таблица prayer_devices не найдена. Сначала выполни supabase/schema.sql в SQL Editor.');
          }
          throw new Error('Push создан, но облачная запись не сохранена: ' + saveError.message + '. Проверь SQL-схему и Anonymous Sign-Ins в Supabase.');
        }
        setStatus('✅ Устройство подключено к облачной базе!\nГород и настройки сохранены. Следующий шаг — добавить секреты Supabase в GitHub Actions, чтобы сервер отправлял уведомления при закрытом сайте.\n\n' + describeEnvironment());
      } catch (error) {
        setStatus('Не удалось включить Push: ' + error.message);
      } finally {
        subscribeButton.disabled = false;
      }
    }
    subscribeButton.addEventListener('click', subscribe);

    copyButton.addEventListener('click', async () => {
      if (!subscriptionJson) return;

      try {
        await navigator.clipboard.writeText(subscriptionJson);
        setStatus('Подписка скопирована. Сохрани её в GitHub Secrets как PUSH_SUBSCRIPTION.');
      } catch (error) {
        setStatus('Автоматическое копирование недоступно. Подписка отображена ниже — скопируй её вручную.');
        const output = document.createElement('textarea');
        output.value = subscriptionJson;
        output.rows = 6;
        output.style.width = '100%';
        output.style.marginTop = '12px';
        output.setAttribute('aria-label', 'Данные подписки');
        document.querySelector('main').appendChild(output);
        output.focus();
        output.select();
      }
    });

    const initial = diagnostics();
    if (!initial.standalone) {
      setStatus('Важно: сейчас страница открыта как вкладка браузера. Для Push на iPhone открой значок «Намаз» с экрана Домой, затем выбери «Звонки» → «Подключить Push».\n\n' + describeEnvironment());
    } else if (!initial.serviceWorker || !initial.pushManager || !initial.notificationAPI) {
      setStatus('В установленном приложении отсутствует одна из необходимых возможностей.\n\n' + describeEnvironment());
    } else {
      setStatus('Готово к подключению. Нажми «Включить уведомления».\n\n' + describeEnvironment());
    }
  </script>
</body>
</html>
